name: foodie
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  carousel_slider: ^5.1.2
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_svg: ^2.3.0
  lottie: ^3.3.1

dev_dependencies:
  flutter_launcher_icons: "^0.14.3"
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/audios/
    - assets/icons/
    - assets/images/
    - assets/svgs/
    - assets/videos/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/suggested_logo.png"
  min_sdk_android: 21


flutter_assets:
  assets_path: assets/svgs
  output_path: lib/core/utils
  filename: assets.dart
  field_prefix: